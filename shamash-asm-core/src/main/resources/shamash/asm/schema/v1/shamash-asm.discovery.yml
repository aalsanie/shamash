version: 1
project:
  bytecode:
    roots: ["."]
    outputsGlobs:
      include: ["**/build/classes/**", "**/build/tmp/kotlin-classes/**", "**/target/classes/**", "**/out/production/**", "**/bin/**", "**/build/intermediates/javac/**"]
      exclude: ["**/build/classes/**/test/**", "**/build/tmp/kotlin-classes/**/test/**", "**/target/test-classes/**", "**/out/test/**", "**/build/**/generated/**", "**/target/generated-sources/**"]
    jarGlobs:
      include: ["**/build/libs/*.jar", "**/target/*.jar", "**/libs/*.jar"]
      exclude: ["**/*-sources.jar", "**/*-javadoc.jar", "**/.gradle/**", "**/.m2/**", "**/node_modules/**"]
  scan: { scope: PROJECT_ONLY, followSymlinks: false, maxClasses: 50000, maxJarBytes: null, maxClassBytes: null }
  validation: { unknownRule: ERROR }
roles: {}
analysis:
  graphs: { enabled: true, granularity: PACKAGE, includeExternalBuckets: false }
  hotspots: { enabled: true, topN: 10, includeExternal: false }
  scoring:
    enabled: false
    model: V1
    godClass: { enabled: false, weights: null, thresholds: null }
    overall: { enabled: false, weights: null, thresholds: null }
rules:
  - { type: graph, name: noCycles, roles: null, enabled: true, severity: ERROR, params: {} }
  - { type: metrics, name: maxMethodsPerClass, roles: null, enabled: true, severity: WARNING, params: { maxMethods: 60 } }
  - { type: metrics, name: maxFieldsPerClass, roles: null, enabled: true, severity: WARNING, params: { maxFields: 30 } }
  - { type: metrics, name: maxFanOut, roles: null, enabled: true, severity: WARNING, params: { max: 35, includeExternal: false } }
exceptions: []
baseline: { mode: NONE, path: ".shamash/baseline/asm-baseline.json" }
export: { enabled: false, outputDir: ".shamash/out/asm", formats: [JSON], overwrite: true }
