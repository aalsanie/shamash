version: 1
project:
  bytecode:
    roots: ["build/classes/java/main"]
    outputsGlobs:
      include: ["**"]
      exclude: []
    jarGlobs:
      include: ["**/*.jar"]
      exclude: ["**/*"]
  scan:
    scope: PROJECT_ONLY
    followSymlinks: false
    maxClasses: null
    maxJarBytes: null
    maxClassBytes: null
  validation:
    unknownRule: ERROR
roles: {}
analysis:
  graphs:
    enabled: false
    granularity: PACKAGE
    includeExternalBuckets: false
  hotspots:
    enabled: false
    topN: 10
    includeExternal: false
  scoring:
    enabled: false
    model: V1
    godClass:
      enabled: false
      weights: null
      thresholds: null
    overall:
      enabled: false
      weights: null
      thresholds: null
rules:
  - type: custom
    name: requiredParam
    roles: null
    enabled: true
    severity: ERROR
    params:
      token: accepted
exceptions: []
baseline:
  mode: NONE
  path: .shamash/baseline.json
export:
  enabled: false
  outputDir: .shamash/reports/asm
  formats: [JSON]
  overwrite: true
