name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
  TERM: dumb

jobs:
  release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid release tag: $GITHUB_REF_NAME"; exit 1; }
          GRADLE_VERSION=$(grep -E '^    version = "[0-9]+\.[0-9]+\.[0-9]+"' build.gradle.kts | head -1 | cut -d'"' -f2)
          ACTION_VERSION=$(grep -E '^    default: "[0-9]+\.[0-9]+\.[0-9]+"' action.yml | head -1 | cut -d'"' -f2)
          test "$VERSION" = "$GRADLE_VERSION" || { echo "::error::Tag $VERSION != Gradle version $GRADLE_VERSION"; exit 1; }
          test "$VERSION" = "$ACTION_VERSION" || { echo "::error::action.yml version $ACTION_VERSION != Gradle version $VERSION"; exit 1; }
          grep -Fqx "## [$VERSION]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no $VERSION release"; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::Release tag is not on main"; exit 1; }

  preflight:
    needs: release-contract
    name: Release preflight
    runs-on: ubuntu-latest
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_ID: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
      MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
    steps:
      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            JETBRAINS_MARKETPLACE_TOKEN \
            JETBRAINS_CERTIFICATE_CHAIN \
            JETBRAINS_PRIVATE_KEY \
            JETBRAINS_PRIVATE_KEY_PASSWORD \
            MAVEN_CENTRAL_USERNAME \
            MAVEN_CENTRAL_PASSWORD \
            MAVEN_SIGNING_KEY \
            MAVEN_SIGNING_KEY_ID \
            MAVEN_SIGNING_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              missing=1
            fi
          done
          test "$missing" -eq 0
          [[ "$MAVEN_SIGNING_KEY" == *"-----BEGIN PGP PRIVATE KEY BLOCK-----"* ]] || { echo "::error::MAVEN_SIGNING_KEY is not an ASCII-armored private key"; exit 1; }
          [[ "$MAVEN_SIGNING_KEY_ID" =~ ^[0-9A-Fa-f]{8}$ ]] || { echo "::error::MAVEN_SIGNING_KEY_ID must be the final eight hexadecimal characters of the primary signing-key fingerprint"; exit 1; }

  verify:
    needs: preflight
    name: Release verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Test + package (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --stacktrace spotlessCheck test :shamash-cli:distZip
      - name: Test + package (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --stacktrace spotlessCheck test :shamash-cli:distZip
      - name: Smoke packaged CLI
        run: python scripts/cli-smoke-test.py "shamash-cli/build/distributions/*.zip"

  plugin-verifier:
    name: Verify IntelliJ plugin
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-intellij-plugin:verifyPlugin

  build-assets:
    name: Build signed release assets
    needs: [verify, plugin-verifier]
    runs-on: ubuntu-latest
    env:
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-cli:distZip :shamash-intellij-plugin:buildPlugin :shamash-intellij-plugin:signPlugin :shamash-intellij-plugin:verifyPluginSignature
      - name: Prepare exact release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          CLI_ZIP=$(find shamash-cli/build/distributions -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$CLI_ZIP" || { echo "CLI ZIP not found"; exit 1; }
          cp "$CLI_ZIP" "release-assets/shamash-cli-${VERSION}.zip"
          SIGNED=$(find shamash-intellij-plugin/build/distributions -maxdepth 1 -name '*-signed.zip' -print -quit)
          test -n "$SIGNED" || { echo "Signed plugin ZIP not found"; exit 1; }
          cp "$SIGNED" "release-assets/shamash-intellij-plugin-${VERSION}.zip"
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-maven-central:
    name: Publish Maven Central libraries
    needs: build-assets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.MAVEN_SIGNING_KEY_ID }}
      ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
      ORG_GRADLE_PROJECT_SONATYPE_CONNECT_TIMEOUT_SECONDS: "120"
      ORG_GRADLE_PROJECT_SONATYPE_CLOSE_TIMEOUT_SECONDS: "1800"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify release signatures
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-configuration-cache --stacktrace -PshamashRequireSigning=true publishLibrariesToTestRepository
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          cleanup() { gpgconf --homedir "$GNUPGHOME" --kill gpg-agent >/dev/null 2>&1 || true; rm -rf "$GNUPGHOME"; }
          trap cleanup EXIT
          printf '%s\n' "$ORG_GRADLE_PROJECT_signingInMemoryKey" | gpg --batch --import >/dev/null
          FINGERPRINT=$(gpg --batch --with-colons --list-secret-keys "$ORG_GRADLE_PROJECT_signingInMemoryKeyId" | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$FINGERPRINT" || { echo "::error::Signing-key fingerprint not found"; exit 1; }
          python scripts/verify-publications.py build/test-maven-repository "${GITHUB_REF_NAME#v}" --signed --signer-fingerprint "$FINGERPRINT"
      - name: Publish one Central deployment
        run: ./gradlew --no-configuration-cache --stacktrace -PshamashRequireSigning=true publishAndReleaseToMavenCentral

  publish-github:
    name: Publish GitHub release
    needs: [build-assets, publish-maven-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt

  publish-marketplace:
    name: Publish JetBrains Marketplace
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-intellij-plugin:publishPlugin
