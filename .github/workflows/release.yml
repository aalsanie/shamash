name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
  TERM: dumb

jobs:
  verify:
    name: Release verification (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Validate tag/version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(grep -E '^    version = "[0-9]+\.[0-9]+\.[0-9]+"' build.gradle.kts | head -1 | cut -d'"' -f2)
          ACTION_VERSION=$(grep -E '^    default: "[0-9]+\.[0-9]+\.[0-9]+"' action.yml | head -1 | cut -d'"' -f2)
          test "$TAG" = "$VERSION" || { echo "Tag $TAG != Gradle version $VERSION"; exit 1; }
          test "$VERSION" = "$ACTION_VERSION" || { echo "action.yml version $ACTION_VERSION != Gradle version $VERSION"; exit 1; }
      - name: Test + package (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --stacktrace spotlessCheck test :shamash-cli:distZip
      - name: Test + package (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --stacktrace spotlessCheck test :shamash-cli:distZip
      - name: Smoke packaged CLI
        run: python scripts/cli-smoke-test.py "shamash-cli/build/distributions/*.zip"

  plugin-verifier:
    name: Verify IntelliJ plugin
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-intellij-plugin:verifyPlugin

  build-assets:
    name: Build signed release assets
    needs: [verify, plugin-verifier]
    runs-on: ubuntu-latest
    env:
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-cli:distZip :shamash-intellij-plugin:buildPlugin :shamash-intellij-plugin:signPlugin
      - name: Prepare exact release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir release-assets
          CLI_ZIP=$(find shamash-cli/build/distributions -maxdepth 1 -name '*.zip' -print -quit)
          test -n "$CLI_ZIP" || { echo "CLI ZIP not found"; exit 1; }
          cp "$CLI_ZIP" "release-assets/shamash-cli-${VERSION}.zip"
          SIGNED=$(find shamash-intellij-plugin/build/distributions -maxdepth 1 -name '*-signed.zip' -print -quit)
          test -n "$SIGNED" || { echo "Signed plugin ZIP not found"; exit 1; }
          cp "$SIGNED" "release-assets/shamash-intellij-plugin-${VERSION}.zip"
          (cd release-assets && sha256sum *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  publish-github:
    name: Publish GitHub release
    needs: build-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS.txt

  publish-marketplace:
    name: Publish JetBrains Marketplace
    needs: publish-github
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-intellij-plugin:publishPlugin
