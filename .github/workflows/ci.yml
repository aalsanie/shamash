name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
  TERM: dumb

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      expensive: ${{ steps.changes.outputs.expensive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Verify IDE fixture project models
        run: python -B -m unittest discover -s scripts/tests -p test_ide_journey_fixtures.py -v
      - name: Classify changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import subprocess

          expensive = True
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
              changed = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z", f"{base}...{head}"
              ])
              paths = [p for p in changed.decode("utf-8", "surrogateescape").split("\0") if p]
              trivial = all(
                  p.endswith(".md") or
                  (p.startswith("docs/") and p.endswith((".png", ".jpg", ".jpeg", ".svg", ".webp")))
                  for p in paths
              )
              expensive = not (paths and trivial)
              subprocess.run(["git", "diff", "--check", f"{base}...{head}"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"expensive={str(expensive).lower()}\n")
          PY
      - name: Verify required CI approver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/environments/ci-approved" --jq \
            '[.protection_rules[] | select(.type == "required_reviewers" and .prevent_self_review == false and (.reviewers | length) == 1 and .reviewers[0].type == "User" and .reviewers[0].reviewer.id == 22101794)] | length' | grep -qx '1'

  authorize:
    name: Approve CI
    needs: preflight
    if: needs.preflight.outputs.expensive == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ci-approved
      deployment: false
    steps:
      - run: echo "CI approved"

  coverage:
    name: Kover coverage report
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify coverage summary parser
        run: python -m unittest discover -s scripts/tests -v
      - name: Generate merged XML and HTML coverage
        run: python scripts/ci-gradle-retry.py ./gradlew --stacktrace :koverXmlReport :koverHtmlReport
      - name: Validate package attribution and summarize coverage
        run: python scripts/coverage-summary.py build/reports/kover/report.xml --output build/reports/coverage/summary.json
      - name: Enforce changed-source line and branch coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check-coverage-diff.py build/reports/kover/report.xml "$BASE_SHA"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-reports
          path: |
            build/reports/kover/**
            build/reports/coverage/**
            **/build/reports/tests/**
            **/build/test-results/test/TEST-*.xml
          if-no-files-found: warn

  build-test:
    name: Build + Test (${{ matrix.os }})
    needs: authorize
    if: needs.authorize.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Spotless + tests (Unix)
        if: runner.os != 'Windows'
        run: python scripts/ci-gradle-retry.py ./gradlew --stacktrace spotlessCheck test
      - name: Spotless + tests (Windows)
        if: runner.os == 'Windows'
        run: python scripts/ci-gradle-retry.py .\gradlew.bat --stacktrace spotlessCheck test
      - name: Verify IntelliJ test discovery
        run: python scripts/verify-plugin-tests.py
      - name: Verify Windows installer and script regressions
        if: runner.os == 'Windows'
        run: python -B -m unittest discover -s scripts/tests -v
      # Build one portable distribution from the fully tested Ubuntu checkout.
      # Smoke jobs execute this exact ZIP on every OS rather than each downloading
      # Gradle and dependencies again to rebuild identical bytecode.
      - name: Package CLI for cross-platform smoke tests
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/ci-gradle-retry.py ./gradlew --stacktrace :shamash-cli:distZip
      - name: Upload tested CLI distribution
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: packaged-cli
          path: shamash-cli/build/distributions/*.zip
          if-no-files-found: error
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/spotless/**
          if-no-files-found: ignore

  ide-journeys:
    name: IDE journeys (${{ matrix.ide }}${{ matrix.suite == 'essential' && ' / essential' || '' }})
    needs: [authorize, build-test]
    if: needs.authorize.result == 'success' && needs.build-test.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide: "2024.2.1"
            suite: full
          - ide: "2025.2"
            suite: essential
          - ide: "2025.3"
            suite: essential
          - ide: "2026.1"
            suite: essential
          - ide: "2026.2"
            suite: full
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Execute real IDE Starter/Driver journeys
        env:
          TEST_IDE: ${{ matrix.ide }}
          TEST_SUITE: ${{ matrix.suite }}
        run: xvfb-run -a -f "$HOME/.Xauthority" python scripts/ci-gradle-retry.py ./gradlew --stacktrace :shamash-intellij-plugin:integrationTest "-PshamashIdeJourneyVersion=$TEST_IDE" "-PshamashIdeJourneySuite=$TEST_SUITE"
      - name: Verify actual JUnit 5 journey execution
        env:
          TEST_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$TEST_SUITE" = "essential" ]; then
            python scripts/verify-plugin-tests.py --integration --essential
          else
            python scripts/verify-plugin-tests.py --integration
          fi
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ide-journeys-${{ matrix.ide }}-${{ matrix.suite }}
          path: |
            shamash-intellij-plugin/build/test-results/integrationTest/**
            shamash-intellij-plugin/build/reports/tests/integrationTest/**
            shamash-intellij-plugin/build/idea-sandbox/**
            out/perf-startup/tests/**/log/idea.log
            out/perf-startup/tests/**/log/screenshots/driverError/**
          if-no-files-found: warn
  packaged-cli-smoke:
    name: Packaged CLI smoke (${{ matrix.os }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Download tested CLI distribution
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: packaged-cli
          path: shamash-cli/build/distributions
      - name: Smoke packaged CLI
        run: python scripts/cli-smoke-test.py "shamash-cli/build/distributions/*.zip"

  plugin-verifier:
    name: IntelliJ Plugin Verifier
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build and verify IntelliJ plugin
        shell: bash
        run: |
          set -o pipefail
          python scripts/ci-gradle-retry.py ./gradlew --stacktrace :shamash-intellij-plugin:buildPlugin :shamash-intellij-plugin:verifyPlugin 2>&1 | tee plugin-verifier.log
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: plugin-verification-reports
          path: |
            plugin-verifier.log
            shamash-intellij-plugin/build/reports/**
            shamash-intellij-plugin/build/verification/**
          if-no-files-found: ignore

  library-verification:
    name: Published library verification
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify validation scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Publish candidate libraries locally
        run: python scripts/ci-gradle-retry.py sh gradlew --no-configuration-cache --stacktrace publishLibrariesToTestRepository
      - name: Verify isolated Java and Kotlin consumers
        run: python scripts/verify-consumers.py
      - name: Verify library ABI against reviewed baseline
        run: python scripts/verify-library-abi.py
      - name: Verify signed candidate publications
        run: python scripts/verify-signed-publications.py
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: library-verification-reports
          path: |
            build/reports/library-consumers/**
            build/reports/library-abi/**
            build/reports/library-signing/**
            shamash-artifacts/build/reports/abi/**
            shamash-export/build/reports/abi/**
            shamash-asm-core/build/reports/abi/**
          if-no-files-found: ignore

  qodana:
    name: Qodana
    needs: authorize
    if: needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qodana Scan
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          pr-mode: ${{ github.event_name == 'pull_request' }}
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          upload-result: false
          push-fixes: none

  required:
    name: Required checks
    if: always()
    needs: [preflight, authorize, coverage, build-test, ide-journeys, packaged-cli-smoke, plugin-verifier, library-verification, qodana]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        shell: bash
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          results = {name: job["result"] for name, job in needs.items()}
          if results["preflight"] != "success":
              sys.exit("Preflight did not succeed")
          expensive = needs["preflight"]["outputs"].get("expensive")
          if expensive not in ("true", "false"):
              sys.exit("Invalid change classification")
          expected = "success" if expensive == "true" else "skipped"
          for name in ("authorize", "coverage", "build-test", "ide-journeys",
                       "packaged-cli-smoke", "plugin-verifier", "library-verification", "qodana"):
              if results[name] != expected:
                  sys.exit(f"{name}: expected {expected}, got {results[name]}")
          print("All applicable checks passed")
          PY
