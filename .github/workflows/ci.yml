name: CI

on:
  pull_request:
  push:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
  TERM: dumb

jobs:
  build-test:
    name: Build + Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Spotless + tests (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --stacktrace spotlessCheck test
      - name: Spotless + tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --stacktrace spotlessCheck test
      - name: Verify IntelliJ test discovery
        run: python scripts/verify-plugin-tests.py
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/spotless/**
          if-no-files-found: ignore

  packaged-cli-smoke:
    name: Packaged CLI smoke (${{ matrix.os }})
    needs: build-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - if: runner.os != 'Windows'
        run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Build CLI distribution (Unix)
        if: runner.os != 'Windows'
        run: ./gradlew --stacktrace :shamash-cli:distZip
      - name: Build CLI distribution (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --stacktrace :shamash-cli:distZip
      - name: Smoke packaged CLI
        run: python scripts/cli-smoke-test.py "shamash-cli/build/distributions/*.zip"

  plugin-verifier:
    name: IntelliJ Plugin Verifier
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x gradlew
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew --stacktrace :shamash-intellij-plugin:buildPlugin :shamash-intellij-plugin:verifyPlugin
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verification-reports
          path: |
            shamash-intellij-plugin/build/reports/**
            shamash-intellij-plugin/build/verification/**
          if-no-files-found: ignore

  library-verification:
    name: Published library verification
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify validation scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Publish candidate libraries locally
        run: sh gradlew --no-configuration-cache --stacktrace publishLibrariesToTestRepository
      - name: Verify isolated Java and Kotlin consumers
        run: python scripts/verify-consumers.py
      - name: Verify library ABI against reviewed baseline
        run: python scripts/verify-library-abi.py
      - name: Verify signed candidate publications
        run: python scripts/verify-signed-publications.py
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: library-verification-reports
          path: |
            build/reports/library-consumers/**
            build/reports/library-abi/**
            build/reports/library-signing/**
            shamash-artifacts/build/reports/abi/**
            shamash-export/build/reports/abi/**
            shamash-asm-core/build/reports/abi/**
          if-no-files-found: ignore
